name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # enablement liga o Pages sozinho na primeira execução, sem precisar mexer nas configurações.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A suíte roda antes de publicar: site no ar com teste vermelho não ajuda ninguém.
      - run: npm test
      # Dependências vulneráveis não devem chegar ao site publicado.
      - run: npm audit --omit=dev
      # O site vive em /pycampus/, e o worker do Python é carregado a partir dessa base.
      - run: npm run build
        env:
          PYCAMPUS_BASE: /pycampus/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
